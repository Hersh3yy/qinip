[package]
name = "qinip"
version = "1.1.0"
edition = "2024"
description = "Free MP3 pack audition player: playlist, coloured waveform, EQ, BPM/key analysis."
# GPL-3.0-or-later: chosen when aubio (GPL) was a dependency; aubio is gone since 1.1.0,
# so the licence is now a choice, not an obligation.
license = "GPL-3.0-or-later"
repository = "https://github.com/Hersh3yy/qinip"
default-run = "qinip"
build = "build.rs"

[package.metadata.bundle]
name = "Qinip"
identifier = "com.hirenbudhrani.qinip"
category = "public.app-category.music"
short_description = "MP3 pack audition player — Clementine for the modern Mac"
osx_minimum_system_version = "11.0"
icon = "assets/icon.png"

[[bin]]
name = "qinip"
path = "src/main.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[dependencies]
anyhow = "1.0.103"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
biquad = "0.6.0"
cpal = "0.18.1"
# `persistence`: settings (volume, autoplay, tag-write opt-in) survive restarts.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
id3 = "1.17.0"
rfd = "0.17.2"
rustfft = "6.4.1"
symphonia = { version = "0.5.4", features = ["mp3"] }
walkdir = "2.5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
souvlaki = "0.8.3"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/qinip.ico and the product name into Qinip.exe (build.rs).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# The Win32 window handle for the media-keys integration (see src/media.rs).
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSImage"] }

[dev-dependencies]
# Headless UI tests: drives the real app without a window (src/ui_tests.rs).
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

# `rune-ui/` (the Rune spike, branch feat/2.0-rune) is its own workspace with its own
# Cargo.lock and [patch] table, so nothing it needs (Rune's winit/wgpu forks) touches this
# package, its lockfile, or the release builds. See rune-ui/README.md.
[workspace]
exclude = ["rune-ui"]
