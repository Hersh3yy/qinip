[package]
name = "dj_player"
version = "1.0.0"
edition = "2024"
default-run = "dj_player"

[package.metadata.bundle]
name = "DJ Player"
identifier = "com.hirenbudhrani.dj-player"
category = "public.app-category.music"
short_description = "MP3 pack audition player"
osx_minimum_system_version = "11.0"
icon = "assets/icon.png"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[dependencies]
anyhow = "1.0.103"
# `builtin` compiles bundled aubio C sources; avoids Homebrew header layout mismatch
# (`include/aubio/aubio.h` vs bindgen's `#include <aubio.h>`) on Apple Silicon.
aubio-rs = { version = "0.2.0", features = ["bindgen", "builtin"] }
biquad = "0.6.0"
cpal = "0.18.1"
eframe = "0.35.0"
egui = "0.35.0"
id3 = "1.17.0"
rfd = "0.17.2"
ringbuf = "0.5.1"
rustfft = "6.4.1"
symphonia = { version = "0.5.4", features = ["mp3"] }
walkdir = "2.5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
