name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag must match Cargo.toml and have a CHANGELOG section, or nothing builds.
  # (workflow_dispatch skips this and never publishes: handy to get a test
  # Windows build from a branch.)
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$TAG" = "$CARGO" ] || { echo "Tag v$TAG but Cargo.toml says $CARGO"; exit 1; }
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "No ## [$TAG] section in CHANGELOG.md"; exit 1; }

  macos:
    name: macOS .app
    needs: verify
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Signing + notarization kick in only when the Apple secrets exist, so
      # forks and early tags still build (ad-hoc). Secrets:
      #   MACOS_CERT_P12        base64 of the exported Developer ID .p12
      #   MACOS_CERT_PASSWORD   password of that .p12
      #   MACOS_SIGN_IDENTITY   "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_P8      base64 of the App Store Connect AuthKey_XXXX.p8
      #   APPLE_API_KEY_ID      its key id
      #   APPLE_API_ISSUER      its issuer uuid
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qinip-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_PROFILE=qinip-notary" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash scripts/package-macos.sh

      - name: Collect artifacts
        run: |
          cp target/release/bundle/qinip-macos-arm64.zip "$GITHUB_WORKSPACE/"
          cp target/release/bundle/qinip-macos-arm64.dmg "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinip-macos-arm64
          path: |
            qinip-macos-arm64.zip
            qinip-macos-arm64.dmg

  windows:
    name: Windows exe
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        shell: bash
        run: |
          cargo build --release --locked --bin qinip
          mkdir -p dist
          cp target/release/qinip.exe "dist/Qinip.exe"
          cp README.md dist/
          cp LICENSE dist/LICENSE.txt
          cp assets/THIRD_PARTY_LICENSES.html dist/
          cd dist
          7z a -tzip ../qinip-windows-x64.zip *

      # The installer: Start menu entry, uninstaller in Settings > Apps, no
      # admin needed. The zip above stays as the portable option.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$VERSION" scripts/windows/qinip.iss
          cp target/release/qinip-setup-x64.exe .
          ls -la qinip-setup-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinip-windows-x64
          path: |
            qinip-windows-x64.zip
            qinip-setup-x64.exe

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          # Checksums let people verify a download is untouched.
          (cd release-assets && sha256sum *.zip *.dmg *.exe > SHA256SUMS.txt)
          ls -la release-assets

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1;next} /^## \[/{f=0} f' CHANGELOG.md > changes.md
          {
            echo "## Download"
            echo ""
            echo "- **macOS (Apple Silicon):** \`qinip-macos-arm64.dmg\`. Open it, drag Qinip to Applications."
            echo "  The Mac build is not notarized by Apple yet, so the first time macOS blocks it:"
            echo "  open **System Settings → Privacy & Security**, scroll down, click **Open Anyway** next to Qinip, confirm. Only needed once."
            echo "- **Windows (x64):** \`qinip-setup-x64.exe\`. Run it; it installs Qinip, adds it to the Start menu and to Settings → Apps for uninstalling. If SmartScreen warns: **More info → Run anyway**. Prefer no installer? \`qinip-windows-x64.zip\` is the portable version."
            echo "- \`SHA256SUMS.txt\` lets you check a download is untouched."
            echo ""
            echo "## What's new"
            cat changes.md
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Qinip ${{ github.ref_name }}
          draft: false
          body_path: notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
