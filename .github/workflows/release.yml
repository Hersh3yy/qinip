name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS .app
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Signing + notarization kick in only when the Apple secrets exist, so
      # forks and early tags still build (ad-hoc). Secrets:
      #   MACOS_CERT_P12        base64 of the exported Developer ID .p12
      #   MACOS_CERT_PASSWORD   password of that .p12
      #   MACOS_SIGN_IDENTITY   "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_P8      base64 of the App Store Connect AuthKey_XXXX.p8
      #   APPLE_API_KEY_ID      its key id
      #   APPLE_API_ISSUER      its issuer uuid
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qinip-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_PROFILE=qinip-notary" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash scripts/package-macos.sh

      - name: Collect artifacts
        run: |
          cp target/release/bundle/qinip-macos-arm64.zip "$GITHUB_WORKSPACE/"
          cp target/release/bundle/Qinip-*.dmg "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinip-macos-arm64
          path: |
            qinip-macos-arm64.zip
            Qinip-*.dmg

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (aubio bindgen)
        run: choco install llvm -y

      - name: Build release
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --bin qinip
          mkdir -p dist
          cp target/release/qinip.exe "dist/Qinip.exe"
          cp README.md dist/
          cd dist
          7z a -tzip ../qinip-windows-x64.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinip-windows-x64
          path: qinip-windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Qinip ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## Qinip ${{ github.ref_name }}

            MP3 pack audition player — playlist, waveform EQ, BPM/key analysis, gapless autoplay.
            Named after the qinip fruit — a Clementine-shaped tool for the Apple Silicon era.

            ### Downloads
            - **macOS (Apple Silicon):** `Qinip-<version>.dmg`, open it and drag `Qinip.app` to Applications
              (or `qinip-macos-arm64.zip`, unzip and drag). Signed and notarized by Apple.
            - **Windows (x64):** `qinip-windows-x64.zip` — unzip and run `Qinip.exe`.

            ### Notes
            - Windows build is not Authenticode-signed yet; SmartScreen may warn (More info → Run anyway).
            - How to use it: see the README.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
