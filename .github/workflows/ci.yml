name: CI

# Every push to master and every pull request: does it build, do the tests
# pass, is clippy clean? Releases are a separate workflow (release.yml),
# started only by a version tag from scripts/release.sh.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
