# Qinip on Rune: a spike that draws Qinip's main screen with the Rune GPU UI framework
# (https://github.com/anomalyco/rune, pre-release, pinned to one `dev` revision). It reuses
# the `qinip` library for everything that is not UI: decoding, waveform peaks, BPM/key
# analysis and playback. Run it with `cargo run -p qinip-rune`.
[package]
name = "qinip-rune"
version = "0.1.0"
edition = "2024"
description = "Spike: Qinip's main screen rebuilt on the Rune UI framework."
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "qinip-rune"
path = "src/main.rs"

[dependencies]
# Qinip itself: playlist, decode worker, analysis, playback, theme palette.
qinip = { path = ".." }
# Rune core: views, layout, renderer, window, headless tooling. `tooling` keeps `--snap`,
# `--tree` and `--script` in release builds; `native-file-dialog` is the Load Folder dialog.
rune = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a", features = ["tooling", "native-file-dialog"] }
# Rune's component kit: the buttons and the virtualised playlist table.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }

# This crate is its own workspace root (the parent excludes it), which is what lets the
# [patch] table below apply: Cargo honours [patch] only at a workspace root.
[workspace]

# Rune's own repository patches these crates.io crates (its README, "Depending on Rune");
# they must be pinned to the same revision as `rune` above. Re-pin all six lines together.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
