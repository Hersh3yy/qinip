# cargo-about config: generates assets/THIRD_PARTY_LICENSES.html, which ships
# inside Qinip.app and the Windows zip. Regenerate after dependency changes:
#   cargo about generate -c scripts/licenses/about.toml scripts/licenses/about.hbs > assets/THIRD_PARTY_LICENSES.html
# `accepted` lists every license currently in the dependency tree; a new
# license fails generation on purpose, so it gets a human look first.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
    "GPL-2.0-only",
    "GPL-3.0",
    "GPL-3.0-or-later",
]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
